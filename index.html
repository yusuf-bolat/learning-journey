<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU-to-AI Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--card:#fff;--soft:#f0efe9;--ink:#1c1c1a;--mute:#6b6a64;--line:#e4e2da;--acc:#2f6f4f;--acc-ink:#fff;--acc2:#e1eee5;--done:#9a9890;--bad:#b3261e;--bad2:#fbe9e7;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--card:#1b1b19;--soft:#232320;--ink:#ecebe6;--mute:#9a9890;--line:#2e2e2a;--acc:#6fbf8f;--acc-ink:#0f1a13;--acc2:#1f3327;--done:#6b6a64;--bad:#f2867c;--bad2:#3a1f1c;--shadow:none}}
:root[data-theme="dark"]{--bg:#121211;--card:#1b1b19;--soft:#232320;--ink:#ecebe6;--mute:#9a9890;--line:#2e2e2a;--acc:#6fbf8f;--acc-ink:#0f1a13;--acc2:#1f3327;--done:#6b6a64;--bad:#f2867c;--bad2:#3a1f1c;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
.mono,code,pre{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
[hidden]{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
button,.btn{font:inherit;font-size:.86rem;font-weight:500;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,filter .15s}
button:hover,.btn:hover{border-color:var(--acc)}
button:disabled{opacity:.6;cursor:wait}
.btn-primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--mute)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea{font:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.brand span{color:var(--acc)}
.tprog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--mute);font-variant-numeric:tabular-nums}
.tprog .bar{width:120px}

/* Home */
.home{max-width:880px;margin:0 auto;padding:36px 16px 96px}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:0 0 8px}
h1{font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 28px;max-width:660px}
.top{padding:20px}
.stats{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none}
.ring span{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.nums{display:flex;flex-wrap:wrap;gap:8px 32px}
.nums b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.nums small{color:var(--mute);font-size:.8rem}
.continue{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 0;padding:14px 16px;border-radius:12px;background:var(--acc);color:var(--acc-ink);text-decoration:none}
.continue small{display:block;font-size:.75rem;opacity:.85;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.continue .go{font-size:1.3rem}
.continue:hover{filter:brightness(1.08)}
.auth{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;font-size:.88rem;color:var(--mute)}
.auth .ctl{display:flex;gap:8px;flex-wrap:wrap}
.auth input{width:220px;max-width:100%}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:32px 4px 12px}
.section-h h2{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0}
.section-h span{font-size:.8rem;color:var(--mute)}
.foot{margin-top:32px;text-align:center}
details.phase{margin-bottom:12px;overflow:hidden}
details.phase.current{border-color:var(--acc)}
details.phase>summary{cursor:pointer;padding:16px 18px;list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
summary::-webkit-details-marker{display:none}
summary{list-style:none}
.num{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--mute);display:grid;place-items:center;font-weight:700}
.current .num{background:var(--acc);color:var(--acc-ink)}
.complete .num{background:var(--acc2);color:var(--acc)}
.phase h3{font-size:1.02rem;font-weight:600;margin:0}
.complete h3{color:var(--mute)}
.phase .why{color:var(--mute);font-size:.88rem;margin:2px 0 8px}
.phase summary .bar{max-width:260px}
.side-r{display:flex;align-items:center;gap:10px}
.chip{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap}
.current .chip,.complete .chip{background:var(--acc2);color:var(--acc)}
.chev{width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s;margin:0 4px 4px}
details[open]>summary .chev{transform:rotate(225deg);margin:4px 4px 0}
.lrows{list-style:none;margin:0;padding:0 10px 8px}
.lrows a{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:.93rem}
.lrows a:hover{background:var(--soft)}
.lrows .lt{flex:1}
.lrows .lm{font-size:.78rem;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.milestone{margin:6px 18px 18px;padding:12px 14px;border-radius:12px;background:var(--acc2);font-size:.9rem}
.milestone::before{content:"★ ";color:var(--acc)}

/* Status icons */
.ic{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--mute);display:inline-grid;place-items:center}
.ic.half{border-color:var(--acc);background:conic-gradient(var(--acc) 50%,transparent 0)}
.ic.done{border-color:var(--acc);background:var(--acc)}
.ic.done::after{content:"";width:4px;height:7px;border-right:2px solid var(--acc-ink);border-bottom:2px solid var(--acc-ink);transform:rotate(45deg);margin-top:-2px}

/* Lesson layout */
.layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 50px)}
.sidebar{position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto;border-right:1px solid var(--line);padding:16px 10px 40px}
.side-h{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:14px 8px 8px}
.sg>summary{cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:10px;font-size:.88rem;font-weight:600}
.sg>summary:hover{background:var(--soft)}
.snum{width:24px;height:24px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:.75rem;color:var(--mute)}
.sg.complete .snum{background:var(--acc2);color:var(--acc)}
.sg.complete .st{color:var(--mute)}
.sc{font-size:.72rem;color:var(--mute);font-weight:500;font-variant-numeric:tabular-nums}
.sg ul{list-style:none;margin:0 0 6px;padding:0}
.sg li a{display:flex;gap:10px;align-items:center;padding:7px 8px 7px 16px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.86rem;line-height:1.35}
.sg li a:hover{background:var(--soft)}
.sg li a.cur{background:var(--acc2);font-weight:600}
.main{padding:24px 32px 96px;min-width:0;max-width:860px}
.crumbs{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--mute);margin-bottom:12px;flex-wrap:wrap}
.crumbs a{color:var(--mute)}
.menu{display:none;padding:5px 10px}
.lh{font-size:clamp(1.4rem,3vw,1.9rem)}
.meta{color:var(--mute);font-size:.88rem;margin:0 0 18px}
.stepper{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.stepper a{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:99px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--mute);font-size:.86rem;font-weight:500}
.stepper .dot{width:22px;height:22px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:.72rem;font-weight:700}
.stepper a.ok .dot{background:var(--acc2);color:var(--acc)}
.stepper a.on{border-color:var(--acc);color:var(--ink)}
.stepper a.on .dot{background:var(--acc);color:var(--acc-ink)}
.panel{padding:24px 28px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:50px auto 0 0;width:min(320px,88vw);z-index:15;background:var(--bg);transform:translateX(-100%);transition:transform .2s;height:auto}
  body.side-open .sidebar{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .menu{display:inline-flex}
  .main{padding:18px 16px 80px}
  .panel{padding:18px 16px}
}

/* Lesson text */
.prose{font-size:.98rem}
.prose h3{font-size:1.08rem;margin:26px 0 8px;letter-spacing:-.01em}
.prose h3:first-child{margin-top:0}
.prose p,.prose ul,.prose ol{margin:0 0 12px}
.prose li{margin:4px 0}
.prose code{font-size:.86em;background:var(--soft);padding:1px 5px;border-radius:5px}
.prose pre{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;font-size:.84rem;line-height:1.55}
.prose pre code{background:none;padding:0;font-size:inherit}
.prose blockquote{margin:16px 0;padding:10px 14px;border-left:3px solid var(--acc);background:var(--acc2);border-radius:0 10px 10px 0}
.prose table{border-collapse:collapse;margin:0 0 14px;font-size:.9rem;display:block;overflow:auto}
.prose th,.prose td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.muted{color:var(--mute)}
.res{margin:16px 0 10px;display:flex;flex-wrap:wrap;gap:6px}
.res a{font-size:.8rem;text-decoration:none;padding:4px 10px;border:1px solid var(--line);border-radius:99px;color:var(--ink);background:var(--bg)}
.res a:hover{border-color:var(--acc);color:var(--acc)}
.res a::after{content:" ↗";color:var(--mute)}

/* Practice */
.banner{padding:10px 14px;border-radius:10px;margin-bottom:16px;font-weight:600;font-size:.9rem}
.banner.ok{background:var(--acc2);color:var(--acc)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 8px}
.grow{flex:1}
.langtag{font-size:.75rem;font-weight:600;color:var(--mute);background:var(--soft);padding:4px 10px;border-radius:99px}
#code{width:100%;min-height:280px;padding:14px;background:var(--soft);font-size:13px;line-height:1.55;tab-size:4;resize:vertical}
.stdin{display:grid;gap:4px;margin-top:10px;font-size:.78rem;font-weight:500;color:var(--mute)}
.stdin textarea{width:100%;font-size:13px;resize:vertical}
.outwrap{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.outwrap .h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--soft);font-size:.75rem;color:var(--mute);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
#verdict{text-transform:none;letter-spacing:0;font-size:.85rem}
.ok{color:var(--acc)}.bad{color:var(--bad)}
#runout{margin:0;padding:12px;font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto}
details.hint{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:0 12px}
details.hint summary{cursor:pointer;padding:10px 0;font-size:.88rem;font-weight:500;color:var(--mute)}
details.hint pre{background:var(--soft);padding:12px;border-radius:8px;overflow:auto;font-size:13px}
.fill{padding-left:20px}
.fill li{margin-bottom:16px}
.fill label{display:block;margin-bottom:6px;font-size:.95rem}
.frow{display:flex;gap:10px;align-items:center}
.frow input{flex:1;max-width:420px;font-size:.9rem}
.fres{font-weight:700;width:16px}
.fhint{font-size:.85rem;color:var(--mute);margin-top:4px}

/* Quiz */
.quiz{padding-left:20px}
.quiz>li{margin-bottom:22px}
.qq{font-weight:600;margin:0 0 8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:.93rem}
.opt:hover{border-color:var(--acc)}
.opt input{margin-top:4px;accent-color:var(--acc)}
.opt.right{border-color:var(--acc);background:var(--acc2)}
.opt.wrong{border-color:var(--bad);background:var(--bad2)}
.quiz .why{font-size:.88rem;margin:6px 0 0}
#qscore{font-weight:600;font-size:.9rem}

/* Tasks */
ul.tasks{list-style:none;margin:8px 0 0;padding:0}
ul.tasks label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:8px;margin:0 -8px;border-radius:10px;font-size:.95rem}
ul.tasks label:hover{background:var(--soft)}
ul.tasks input{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;margin:3px 0 0;padding:0;border:1.5px solid var(--mute);border-radius:6px;display:grid;place-items:center;cursor:pointer;background:transparent}
ul.tasks input::after{content:"";width:5px;height:9px;border-right:2px solid var(--acc-ink);border-bottom:2px solid var(--acc-ink);transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .15s}
ul.tasks input:checked{background:var(--acc);border-color:var(--acc)}
ul.tasks input:checked::after{transform:rotate(45deg) scale(1)}
ul.tasks input:checked+span{color:var(--done);text-decoration:line-through}
.panel .milestone{margin:16px 0 0}
</style>
</head>
<body>
<header class="topbar"><div class="in">
  <a class="brand" href="#/">GPU<span>→</span>AI Journey</a>
  <div class="tprog"><span id="toppct">0%</span><div class="bar" id="topbar"><i></i></div></div>
</div></header>
<div id="app"></div>

<script src="lessons/p4.js?v=2" onerror="this.remove()"></script>
<script src="lessons/p5.js?v=2" onerror="this.remove()"></script>
<script src="lessons/p6.js?v=2" onerror="this.remove()"></script>

<script src="lessons/p8.js?v=2" onerror="this.remove()"></script>

<script src="lessons/p10.js?v=2" onerror="this.remove()"></script>

</body>
</html>
